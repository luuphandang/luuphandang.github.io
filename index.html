<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quyển Sách Hình Ảnh</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Desk Environment */
    .desk {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #8B4513 0%, #A0522D 50%, #8B4513 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .desk::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
    }

    /* Instructions */
    .instructions {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      color: #2c3e50;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Book Container */
    .book-container {
      position: relative;
      width: 700px;
      height: 500px;
      perspective: 1200px;
      transform: rotateX(15deg) rotateY(-5deg);
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      display: flex;
    }

    .page-spread {
      position: relative;
      width: 50%;
      height: 100%;
    }

    /* Page Styles */
    .page {
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 5px;
      box-shadow: 
        0 0 0 1px rgba(0,0,0,0.1),
        0 5px 15px rgba(0, 0, 0, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                  opacity 0.3s ease, 
                  visibility 0.3s ease;
      cursor: grab;
      overflow: hidden;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .page:active {
      cursor: grabbing;
    }

    .page.left-page {
      border-radius: 5px 0 0 5px;
      transform-origin: right center;
    }

    .page.right-page {
      border-radius: 0 5px 5px 0;
      transform-origin: left center;
    }

    /* Page Content */
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      pointer-events: none;
    }

    .page-number {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-family: 'Arial', sans-serif;
    }

    /* Cover Styles */
    .cover-front,
    .cover-back {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .cover-front::before,
    .cover-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
        linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    }

    .cover-back::before {
      background: 
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.1) 0%, transparent 50%),
        linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    }

    .book-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      z-index: 1;
    }

    .book-subtitle {
      font-size: 14px;
      opacity: 0.9;
      z-index: 1;
    }

    .book-spine {
      position: absolute;
      left: 0;
      top: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(90deg, #1a252f 0%, #2c3e50 100%);
      border-radius: 5px 0 0 5px;
    }

    /* Animation States */
    .page.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .page.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .page.flipping {
      transform: rotateY(-180deg);
    }

    .page.flipping-reverse {
      transform: rotateY(180deg);
    }

    /* Hidden Controls */
    .flip-indicator {
      display: none;
    }
  </style>
</head>
<body>
  <div class="desk">
    <div class="instructions">
      📖 Kéo từ phải sang trái để lật trang tiếp theo
    </div>
    
    <div class="book-container">
      <div class="book" id="book">
        <!-- Left Pages -->
        <div class="page-spread">
          <div class="page left-page hidden" id="leftPage-back">
            <div class="book-title">Cảm ơn!</div>
            <div class="book-subtitle">Đã xem hết cuốn sách</div>
            <div class="page-number">Bìa sau</div>
          </div>
          
          <div class="page left-page hidden" id="leftPage-6">
            <img src="https://picsum.photos/350/500?random=5" alt="Hình ảnh 5">
            <div class="page-number">6</div>
          </div>
          
          <div class="page left-page hidden" id="leftPage-4">
            <img src="https://picsum.photos/350/500?random=3" alt="Hình ảnh 3">
            <div class="page-number">4</div>
          </div>
          
          <div class="page left-page hidden" id="leftPage-2">
            <img src="https://picsum.photos/350/500?random=1" alt="Hình ảnh 1">
            <div class="page-number">2</div>
          </div>
        </div>

        <!-- Right Pages -->
        <div class="page-spread">
          <div class="page right-page visible" id="rightPage-cover">
            <div class="book-spine"></div>
            <div class="book-title">Cuốn Sách</div>
            <div class="book-subtitle">Hình Ảnh Đẹp</div>
            <div class="page-number">Bìa</div>
          </div>
          
          <div class="page right-page hidden" id="rightPage-3">
            <img src="https://picsum.photos/350/500?random=2" alt="Hình ảnh 2">
            <div class="page-number">3</div>
          </div>
          
          <div class="page right-page hidden" id="rightPage-5">
            <img src="https://picsum.photos/350/500?random=4" alt="Hình ảnh 4">
            <div class="page-number">5</div>
          </div>
          
          <div class="page right-page hidden" id="rightPage-7">
            <img src="https://picsum.photos/350/500?random=6" alt="Hình ảnh 6">
            <div class="page-number">7</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    class BookFlip {
      constructor() {
        this.currentSpread = 0;
        this.totalSpreads = 4;
        this.isAnimating = false;
        this.dragThreshold = 50;
        this.animationDuration = 400;
        
        this.pageMapping = {
          0: { left: null, right: 'rightPage-cover' },
          1: { left: 'leftPage-2', right: 'rightPage-3' },
          2: { left: 'leftPage-4', right: 'rightPage-5' },
          3: { left: 'leftPage-6', right: 'rightPage-7' },
          4: { left: 'leftPage-back', right: null }
        };
        
        this.init();
      }

      init() {
        this.setupEventListeners();
        this.updatePages();
      }

      setupEventListeners() {
        // Mouse events
        document.addEventListener('mousedown', this.handleStart.bind(this));
        document.addEventListener('mousemove', this.handleMove.bind(this));
        document.addEventListener('mouseup', this.handleEnd.bind(this));
        
        // Touch events
        document.addEventListener('touchstart', this.handleStart.bind(this));
        document.addEventListener('touchmove', this.handleMove.bind(this));
        document.addEventListener('touchend', this.handleEnd.bind(this));
        
        // Keyboard events
        document.addEventListener('keydown', this.handleKeydown.bind(this));
      }

      handleStart(e) {
        if (this.isAnimating) return;
        
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        this.dragStartX = clientX;
        this.isDragging = true;
        
        if (e.type.includes('touch')) {
          e.preventDefault();
        }
      }

      handleMove(e) {
        if (!this.isDragging) return;
        
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const deltaX = clientX - this.dragStartX;
        
        if (Math.abs(deltaX) > this.dragThreshold) {
          if (deltaX < -this.dragThreshold && this.currentSpread < this.totalSpreads) {
            this.nextSpread();
          } else if (deltaX > this.dragThreshold && this.currentSpread > 0) {
            this.prevSpread();
          }
          this.isDragging = false;
        }
        
        if (e.type.includes('touch')) {
          e.preventDefault();
        }
      }

      handleEnd() {
        this.isDragging = false;
      }

      handleKeydown(e) {
        if (e.key === 'ArrowRight') this.nextSpread();
        if (e.key === 'ArrowLeft') this.prevSpread();
      }

      nextSpread() {
        if (this.currentSpread >= this.totalSpreads || this.isAnimating) return;
        
        this.isAnimating = true;
        this.currentSpread++;
        
        const rightPage = document.querySelector('.page-spread:last-child .page.visible');
        if (rightPage) {
          rightPage.classList.add('flipping');
        }
        
        setTimeout(() => {
          this.updatePages();
          if (rightPage) {
            rightPage.classList.remove('flipping');
          }
          this.isAnimating = false;
        }, this.animationDuration);
      }

      prevSpread() {
        if (this.currentSpread <= 0 || this.isAnimating) return;
        
        this.isAnimating = true;
        this.currentSpread--;
        
        const leftPage = document.querySelector('.page-spread:first-child .page.visible');
        if (leftPage) {
          leftPage.classList.add('flipping-reverse');
        }
        
        setTimeout(() => {
          this.updatePages();
          if (leftPage) {
            leftPage.classList.remove('flipping-reverse');
          }
          this.isAnimating = false;
        }, this.animationDuration);
      }

      updatePages() {
        const spread = this.pageMapping[this.currentSpread];
        
        // Hide all pages
        document.querySelectorAll('.page').forEach(page => {
          page.className = page.className.replace(/visible|hidden/, 'hidden');
        });
        
        // Show current pages
        if (spread.left) {
          const leftPage = document.getElementById(spread.left);
          if (leftPage) {
            leftPage.className = leftPage.className.replace('hidden', 'visible');
          }
        }
        
        if (spread.right) {
          const rightPage = document.getElementById(spread.right);
          if (rightPage) {
            rightPage.className = rightPage.className.replace('hidden', 'visible');
          }
        }
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      new BookFlip();
    });
  </script>
</body>
</html>
